<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bangla Alphabet BD - Learn the Bangla Bornomala</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1 data-i18n="title">Bangla Alphabet BD</h1>
  <p data-i18n="subtitle">Learn the 50 letters of the Bangla bornomala.</p>
  <div class="topbar">
    <span class="progress" id="progress"></span>
    <button id="langBtn">Bangla</button>
  </div>
</header>
<main>
  <div class="tabs">
    <button data-tab="explore" class="active" data-i18n="tabExplore">Explore</button>
    <button data-tab="cards" data-i18n="tabCards">Flashcards</button>
    <button data-tab="quiz" data-i18n="tabQuiz">Quiz</button>
  </div>

  <section id="tab-explore">
    <div class="card">
      <div class="controls">
        <input type="search" id="searchInput" placeholder="Search letter, name, or example...">
        <button class="chip active" data-filter="all" data-i18n="filterAll">All</button>
        <button class="chip" data-filter="vowel" data-i18n="filterVowels">Vowels (11)</button>
        <button class="chip" data-filter="consonant" data-i18n="filterConsonants">Consonants (39)</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="detail card" id="detail"></div>
    </div>
  </section>

  <section id="tab-cards" style="display:none">
    <div class="card">
      <div class="flash" id="flashBox"></div>
      <p style="text-align:center" id="cardPos"></p>
      <div class="row">
        <button class="secondary" id="cardPrevBtn" data-i18n="cardPrev">Previous</button>
        <button class="secondary" id="cardFlipBtn" data-i18n="cardFlip">Flip</button>
        <button class="secondary" id="cardNextBtn" data-i18n="cardNext">Next</button>
        <button class="secondary" id="cardShuffleBtn" data-i18n="cardShuffle">Shuffle</button>
        <button class="primary" id="cardMarkBtn" data-i18n="markLearned">Mark as learned</button>
      </div>
      <div class="row">
        <button class="danger" id="resetBtn" data-i18n="resetProgress">Reset progress</button>
        <span id="resetMsg" class="muted"></span>
      </div>
    </div>
  </section>

  <section id="tab-quiz" style="display:none">
    <div class="card quiz" id="quizBox"></div>
  </section>
</main>
<footer>
  <p data-i18n="footer">Learning aid only.</p>
</footer>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
